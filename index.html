<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12203D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roteiro NYC">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>Guia NYC — Roteiro</title>
<style>
  :root{
    --paper:#FAFAF6;
    --paper-dim:#F1EFE7;
    --ink:#12203D;
    --ink-soft:#4A5568;
    --line-grey:#D9D5C7;
    --mta-orange:#FF6319;
    --mta-red:#EE352E;
    --mta-blue:#0039A6;
    --mta-green:#00933C;
    --mta-purple:#B933AD;
    --mta-yellow:#996633;
    --tip-bg:#FFF6E9;
    --tip-border:#F0C572;
    --tip-text:#5C3D0A;
    --card-bg:#FFFFFF;
    --optional-bg:#F2F0FA;
    --optional-border:#B9AEE0;
    /* Fixed brand surfaces — do NOT change between light/dark mode */
    --brand-dark:#12203D;
    --brand-light:#FAFAF6;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14161C;
      --paper-dim:#1E212B;
      --ink:#F0EFE9;
      --ink-soft:#9A9EAC;
      --line-grey:#32343E;
      --tip-bg:#2A2412;
      --tip-border:#5C4A1E;
      --tip-text:#F0D9A0;
      --card-bg:#1C1E27;
      --optional-bg:#211E2E;
      --optional-border:#463C63;
    }
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    overscroll-behavior-y:none;
  }

  .mono{ font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; }

  /* ============ NAV / TOP BAR ============ */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--brand-dark);
    color:var(--brand-light);
    padding:calc(10px + env(safe-area-inset-top)) max(16px, calc((100% - 640px) / 2 + 16px)) 8px;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:48px;
  }
  .back-btn{
    background:none; border:none; color:var(--brand-light);
    font-size:20px; cursor:pointer;
    width:44px; height:44px;
    margin-left:-10px;
    display:flex; align-items:center; justify-content:center;
    opacity:0.9;
    border-radius:8px;
  }
  .back-btn:active{ background:rgba(250,250,246,0.12); }
  .topbar-title{
    font-size:15px; font-weight:600; letter-spacing:0.01em;
  }

  /* ============ MACRO SCREEN ============ */
  .macro-header{
    background:var(--brand-dark);
    color:var(--brand-light);
    padding:22px max(20px, calc((100% - 640px) / 2 + 20px)) 22px;
    position:relative;
  }
  /* Quando é a primeira coisa da tela (só a Home tem esse caso — as
     outras têm uma .topbar acima que já cuida do notch/status bar) */
  #app > .macro-header:first-child{
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .macro-eyebrow{
    font-family:ui-monospace, monospace;
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--mta-orange); margin-bottom:8px;
  }
  .macro-title{
    font-size:24px; font-weight:800; line-height:1.15; letter-spacing:-0.01em;
  }
  .macro-sub{
    margin-top:6px; font-size:13px; color:rgba(250,250,246,0.65); line-height:1.4;
  }

  .day-list{
    max-width:640px; margin:0 auto;
    padding:14px 16px 8px;
    display:flex; flex-direction:column; gap:8px;
  }

  .day-card{
    display:block;
    background:var(--card-bg);
    border:1px solid var(--line-grey);
    border-radius:12px;
    padding:12px 14px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .day-card:active{ background:var(--paper-dim); }
  .day-card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:5px;
  }
  .day-card.c1::before{ background:var(--mta-green); }
  .day-card.c2::before{ background:var(--mta-orange); }
  .day-card.c3::before{ background:var(--mta-red); }
  .day-card.c4::before{ background:var(--mta-blue); }
  .day-card.c5::before{ background:var(--mta-purple); }
  .day-card.c6::before{ background:var(--mta-yellow); }

  .day-card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .day-date{
    font-family:ui-monospace, monospace;
    font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;
  }
  .day-name{
    font-size:16px; font-weight:700; margin-top:2px; line-height:1.25;
  }
  .day-chevron{ font-size:20px; color:var(--ink-soft); margin-top:2px; }

  .meta-stops{ color:#3B82F6 !important; font-weight:600; }

  .landing-nav{
    max-width:640px; margin:0 auto;
    padding:20px 16px 8px;
    display:flex; flex-direction:column; gap:12px;
  }
  .landing-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card-bg);
    border:1px solid var(--line-grey);
    border-radius:14px;
    padding:18px;
    cursor:pointer;
  }
  .landing-card:active{ background:var(--paper-dim); }
  .landing-card-icon{
    width:48px; height:48px;
    border-radius:12px;
    background:var(--paper-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    flex-shrink:0;
  }
  .landing-card-text{ flex:1; min-width:0; }
  .landing-card-title{ font-size:16px; font-weight:700; color:var(--ink); }
  .landing-card-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4; }

  .day-meta{
    display:flex; gap:10px; margin-top:6px; flex-wrap:wrap;
  }
  .day-meta span{
    font-size:12px; color:var(--ink-soft);
    display:flex; align-items:center; gap:4px;
  }
  .badge{
    display:inline-block; font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:20px;
    font-family:ui-monospace, monospace;
  }
  .badge.forte{ background:#FDEAE8; color:var(--mta-red); }
  .badge.muitoforte{ background:var(--brand-dark); color:white; }
  .badge.moderado{ background:#FFF3DE; color:#8A5A00; }
  .badge.leve{ background:#E6F6EC; color:var(--mta-green); }

  .status-tag{
    margin-top:10px;
    display:inline-block;
    font-size:11px;
    font-family:ui-monospace, monospace;
    padding:3px 8px;
    border-radius:6px;
    background:var(--paper-dim);
    color:var(--ink-soft);
  }
  .status-tag.ready{ background:#E6F6EC; color:var(--mta-green); }

  /* ============ DAY DETAIL SCREEN ============ */
  .day-header{
    background:var(--brand-dark);
    color:var(--brand-light);
    padding:10px max(18px, calc((100% - 640px) / 2 + 18px)) 16px;
  }
  .day-header-eyebrow{
    font-family:ui-monospace, monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--mta-orange); margin-bottom:3px;
  }
  .day-header h1{
    font-size:22px; font-weight:800; line-height:1.15;
  }

  .summary-bar{
    max-width:640px; margin:0 auto;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    background:var(--paper-dim);
    border-bottom:1px solid var(--line-grey);
  }
  .summary-item{
    padding:12px 14px;
    border-right:1px solid var(--line-grey);
    border-bottom:none;
  }
  .summary-item:nth-child(2n){ border-right:none; }
  .summary-item:only-child{ grid-column:1 / -1; }
  .summary-label{
    font-family:ui-monospace, monospace;
    font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); margin-bottom:3px;
  }
  .summary-value{
    font-size:14px; font-weight:700;
  }

  .container{
    max-width:640px; margin:0 auto; padding:0 16px;
  }

  .section-title{
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--ink-soft);
    margin:26px 0 14px;
    display:flex; align-items:center; gap:6px;
  }

  /* FLOW — grid de 3 colunas: horário (fora do card) | nó | conteúdo */
  .route{ position:relative; }
  .route-line{
    position:absolute;
    left:calc(16px + 54px + 12px); /* padding + coluna do horário + centro do nó */
    top:6px; bottom:6px; width:3px;
    background:var(--mta-orange); border-radius:3px;
  }

  .tl-row{
    display:flex;
    align-items:flex-start;
    position:relative;
  }

  .tl-time{
    flex:0 0 54px;
    width:54px;
    text-align:right;
    font-family:ui-monospace, monospace;
    font-size:11px;
    font-weight:700;
    color:var(--mta-orange);
    padding-top:14px;
    padding-right:8px;
    line-height:1.3;
  }

  .tl-node{
    flex:0 0 24px;
    width:24px;
    position:relative;
    display:flex;
    justify-content:center;
  }
  .tl-node .dot{
    width:16px; height:16px; border-radius:50%;
    background:var(--brand-dark); border:2px solid var(--brand-dark);
    margin-top:16px; z-index:2;
  }
  .tl-node .dot.hollow{
    width:14px; height:14px;
    background:var(--paper); border:2px solid var(--ink-soft);
    margin-top:12px;
  }

  .tl-content{
    flex:1 1 auto;
    min-width:0;
  }

  .flow-transit{
    padding:10px 12px;
    margin:2px 0 16px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    background:var(--paper-dim);
    border-radius:6px;
  }
  .address-chip,
  .station-chip{
    display:inline-block;
    border-radius:5px;
    padding:1px 5px;
    font-weight:700;
    line-height:1.35;
  }
  .address-chip{
    color:var(--brand-dark);
    background:#FFF0E8;
    border:1px solid #FFD2BD;
  }
  .station-chip{
    color:var(--mta-blue);
    background:#EAF1FF;
    border:1px solid #BED0FA;
  }
  .station-inline{
    color:var(--mta-blue);
    font-weight:700;
  }
  .flow-tip .tip-text{
    flex:1 1 auto;
    min-width:0;
  }

  .flow-stop{
    background:var(--card-bg);
    border:1px solid var(--line-grey);
    border-radius:10px;
    padding:16px 16px 15px;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .flow-time-label{
    font-family:ui-monospace, monospace;
    font-size:10px; font-weight:700;
    color:var(--mta-orange);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .duration-tag{
    display:inline-flex;
    align-self:flex-start;
    font-family:ui-monospace, monospace;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper-dim);
    padding:4px 10px;
    border-radius:20px;
  }

  .store-list{
    display:flex;
    flex-direction:column;
    border:1px solid var(--line-grey);
    border-radius:10px;
    padding:2px 12px;
    background:var(--card-bg);
  }

  .resto-card{
    background:var(--card-bg);
    border:1px solid var(--line-grey);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .resto-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .resto-name{ font-weight:700; font-size:14px; color:var(--ink); }
  .resto-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .resto-pick{ font-size:12.5px; color:var(--ink); line-height:1.5; }
  .resto-pick b{ color:var(--mta-orange); font-weight:700; }

  .see-more-link{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    font-weight:600;
    color:var(--mta-blue);
    cursor:pointer;
    align-self:flex-start;
  }
  .see-more-link:active{ opacity:0.7; }

  /* RESTAURANT INFO MODAL — bottom sheet */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(18,32,61,0.5);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .modal-sheet{
    position:absolute;
    left:0; right:0; bottom:0;
    max-width:640px;
    margin:0 auto;
    background:var(--paper);
    border-radius:20px 20px 0 0;
    padding:14px 22px calc(30px + env(safe-area-inset-bottom));
    max-height:80vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow:0 -8px 30px rgba(18,32,61,0.25);
  }
  .modal-overlay.open .modal-sheet{
    transform:translateY(0);
  }
  .modal-handle{
    width:36px; height:4px;
    background:var(--line-grey);
    border-radius:3px;
    margin:4px auto 20px;
  }
  .modal-close{
    position:absolute;
    top:14px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    background:var(--paper-dim);
    color:var(--ink-soft);
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-close:active{ background:var(--line-grey); }
  #resto-modal-content .resto-name{ font-size:18px; line-height:1.3; }
  .resto-tipo{
    display:inline-block;
    font-family:ui-monospace, monospace;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--mta-orange);
    background:var(--tip-bg);
    border:1px solid var(--tip-border);
    padding:3px 9px;
    border-radius:20px;
    margin:6px 0 8px;
  }
  #resto-modal-content .resto-tipo{ margin:10px 0 14px; }
  #resto-modal-content .resto-desc{ font-size:13.5px; line-height:1.6; margin:0 0 16px; }
  #resto-modal-content .resto-pick{ font-size:13.5px; line-height:1.6; margin-bottom:14px; }
  #resto-modal-content .resto-header{ padding-right:36px; }

  .resto-trigger{ cursor:pointer; }
  .resto-trigger:active{ opacity:0.7; }

  .back-to-top-btn{
    position:fixed;
    right:16px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    background:var(--brand-dark);
    color:var(--brand-light);
    font-size:18px;
    font-weight:700;
    box-shadow:0 6px 20px rgba(18,32,61,0.35);
    z-index:15;
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    cursor:pointer;
  }
  .back-to-top-btn.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .back-to-top-btn:active{ background:#0c1830; }
  .store-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px dashed var(--line-grey);
  }
  .store-row.required{ border-bottom-style:solid; }
  .store-row:last-child{ border-bottom:none; }
  .store-info{ min-width:0; display:flex; flex-direction:column; gap:1px; }
  .store-name{
    font-size:13.5px;
    color:var(--ink);
    font-weight:400;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .store-row.required .store-name{ font-weight:700; }
  .ticket-badge{
    display:inline-flex;
    align-items:center;
    align-self:flex-start;
    font-family:ui-monospace, monospace;
    font-size:10px;
    font-weight:700;
    color:#8A5A00;
    background:#FFF3DE;
    padding:3px 8px;
    border-radius:20px;
    margin:4px 0 3px;
  }
  .store-tag{
    font-family:ui-monospace, monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }

  .transit-link{
    display:block;
    margin-top:10px;
    text-align:center;
    border:1px solid var(--mta-orange);
    border-radius:9px;
    padding:11px;
    background:var(--mta-orange);
    color:#fff;
    font-size:13px; font-weight:600;
    text-decoration:none;
  }
  .transit-link:active{ opacity:0.85; }

  /* Dentro de um trecho de transporte o botão é secundário — discreto,
     para não competir com o da saída do hotel. */
  .flow-transit .transit-link{
    margin-top:8px;
    background:transparent;
    color:var(--mta-orange);
    border-color:var(--line-grey);
    font-size:12px;
    padding:8px;
  }

  .wishlist{
    border:1px solid var(--line-grey);
    border-radius:9px;
    background:var(--paper-dim);
    padding:10px 12px;
    display:flex; flex-direction:column; gap:6px;
  }
  .wishlist-title{
    font-family:ui-monospace, monospace;
    font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.04em;
    color:var(--ink-soft);
  }
  .wishlist-item{
    font-size:13.5px; font-weight:600; color:var(--ink);
    line-height:1.4;
    padding-left:14px; position:relative;
  }
  .wishlist-item::before{
    content:"▸"; position:absolute; left:0;
    color:var(--mta-orange);
  }

  /* ---- Gastronomia agrupada por dia ---- */
  /* ---- Gastronomia: chips, resumo e linhas compactas ---- */
  .gchips{
    display:flex; gap:6px; overflow-x:auto;
    padding:2px 0 10px;
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--line-grey);
    margin-bottom:14px;
    -webkit-overflow-scrolling:touch;
  }
  .gchips::-webkit-scrollbar{ display:none; }
  .gchip{
    flex-shrink:0;
    padding:7px 14px;
    border:1px solid var(--line-grey);
    border-radius:20px;
    background:var(--card-bg);
    color:var(--ink);
    font-family:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer;
  }
  .gchip.on{ background:var(--mta-orange); border-color:var(--mta-orange); color:#fff; }

  .gsum-stats{ display:flex; gap:9px; margin-bottom:14px; }
  .gsum-stats > div{
    flex:1; text-align:center;
    border:1px solid var(--line-grey); border-radius:10px;
    background:var(--card-bg); padding:11px 8px;
  }
  .gsum-stats b{ display:block; font-size:21px; font-weight:700; line-height:1.1; }
  .gsum-stats span{
    font-family:ui-monospace, monospace; font-size:9.5px;
    text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);
  }

  .gsum-list{
    border:1px solid var(--line-grey); border-radius:12px;
    background:var(--card-bg); overflow:hidden;
  }
  .gsum-row{
    display:flex; align-items:center; gap:10px;
    padding:13px 14px;
    border-bottom:1px solid var(--line-grey);
    cursor:pointer;
  }
  .gsum-row:last-child{ border-bottom:none; }
  .gsum-row:active{ background:var(--paper-dim); }
  .gsum-left{ flex:1; min-width:0; }
  .gsum-dia{ font-size:14.5px; font-weight:700; line-height:1.2; }
  .gsum-dia span{
    font-family:ui-monospace, monospace; font-size:10.5px;
    font-weight:400; color:var(--ink-soft); margin-left:4px;
  }
  .gsum-tema{ font-size:11.5px; color:var(--ink-soft); margin:2px 0 5px; }
  .gsum-right{ text-align:right; flex-shrink:0; }
  .gsum-valor{
    font-family:ui-monospace, monospace;
    font-size:14px; font-weight:700; color:var(--mta-orange);
  }
  .gsum-nota{
    font-family:ui-monospace, monospace; font-size:9.5px;
    text-transform:uppercase; color:var(--ink-soft); margin-top:2px;
  }

  .gprog{ display:flex; gap:4px; }
  .gprog i{ flex:1; height:4px; border-radius:3px; background:var(--line-grey); max-width:34px; }
  .gprog i.ok{ background:#2E9E5B; }
  .gprog.small i{ height:3px; max-width:22px; }

  .gdia-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  /* Preço dentro do popup do restaurante */

  /* ---- Tela de Ingressos ---- */

  .backup-actions{ display:flex; gap:10px; margin-top:12px; }

  .backup-box{
    width:100%; margin-top:10px; box-sizing:border-box;

  .status-pill.st-pendente{ color:#8A3D00; background:#FFE8D4; }
  .status-pill.st-reserva{ color:#6B2E7A; background:#F2E2F7; }

    border:1px solid var(--line-grey);

  @media (prefers-color-scheme: dark){
    .day-pill{ color:#14161C; background:#C9CCD6; }
    .status-pill.st-parada{ color:#8FE3B0; background:#123322; }
    .status-pill.st-pendente{ color:#F0BE8C; background:#3A2412; }
    .status-pill.st-reserva{ color:#D9A8E8; background:#2E1836; }
    .resto-reserva-head{ color:#D9A8E8; }
    .resto-reserva{ border-left-color:#8E44AD; }
    .status-pill.st-opcao{ color:#AFC0DA; background:#1E2534; }

  .store-tag.required{ color:var(--mta-orange); font-weight:700; }
  .store-tag.optional{ color:var(--ink-soft); }
  .flow-title{
    font-size:17px; font-weight:700; line-height:1.2;
  }
  .flow-desc{
    font-size:13.5px; color:var(--ink-soft); line-height:1.5;
  }
  .flow-tip{
    background:var(--tip-bg);
    border:1px solid var(--tip-border);
    border-radius:6px;
    padding:10px 12px;
    font-size:12.5px;
    line-height:1.55;
    color:var(--tip-text);
    display:flex; gap:8px;
  }
  .flow-optional{
    background:var(--optional-bg);

  .hook{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--card-bg);
    border:1px dashed var(--line-grey);
    border-radius:8px;

  }
  .hook:active{ background:var(--paper-dim); }
  .hook .hook-text{ flex:1 1 auto; min-width:0; }
  .hook .arrow{ color:var(--ink-soft); flex:0 0 auto; white-space:nowrap; font-size:12px; }

  /* OVERVIEW — retrátil, nativo via <details> */
  .overview-block{
    background:var(--card-bg);
    border:1px solid var(--line-grey);
    border-radius:10px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .overview-block summary{
    list-style:none;
    cursor:pointer;
    padding:14px 16px;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .overview-block summary::-webkit-details-marker{ display:none; }
  .overview-block summary::after{
    content:"⌄";
    font-size:18px;
    color:var(--ink-soft);
    transition:transform 0.2s ease;
    margin-left:8px;
  }
  .overview-block[open] summary::after{ transform:rotate(180deg); }
  .overview-block summary:active{ background:var(--paper-dim); }

  .flow-details .route{
    padding:0 16px 16px;
  }
  /* FLUXO DO DIA — uma etapa retrátil por vez */
  .flow-steps{ display:flex; flex-direction:column; gap:8px; }
  .flow-step{
    background:var(--card-bg);
    border:1px solid var(--line-grey);
    border-radius:10px;
    overflow:hidden;
  }
  .flow-step summary{
    list-style:none;
    cursor:pointer;
    padding:14px 16px;
    min-height:48px;
    display:block;
    overflow:hidden; /* clearfix para o float interno */
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .flow-step summary::-webkit-details-marker{ display:none; }
  .step-actions{
    float:right;
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:8px;
    margin-top:2px;
  }
  .step-chevron{
    font-size:18px;
    color:var(--ink-soft);
    transition:transform .2s ease;
    display:inline-block;
    flex-shrink:0;
  }
  .flow-step[open] .step-chevron{ transform:rotate(180deg); }
  .flow-step summary:active{ background:var(--paper-dim); }
  .flow-step[open]{
    border-left:3px solid var(--mta-orange);
  }
  .flow-step[open] summary{
    background:var(--paper-dim);
  }

  .stop-count.route-link{

  .maps-icon-btn{

    inset:-8px;
  }

  .ig-icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px; height:24px;
    border-radius:50%;
    background:#FCE9F1;
    border:1px solid #F3B8D3;
    color:#C2185B;
    font-size:12px;
    flex-shrink:0;
    position:relative;
    margin-left:6px;
  }

    font-weight:600;

let offlineToastTimer = null;
function showOfflineToast(){
  const toast = document.getElementById("offline-toast");
  if(!toast) return;
  toast.classList.add("show");
  clearTimeout(offlineToastTimer);
  offlineToastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
}

function getAttractionsList(){
  const skipKeys = new Set(["hotel-out", "hotel-back", "cafe", "almoco", "jantar", "hotelbreak", "zara34", "mtckitchen", "timeoutmarket", "artichoke", "fashionphile", "appleuws"]);
  const list = [];
  const seen = new Set();
  Object.keys(STEPS_BY_DAY).forEach(dayId => {
    STEPS_BY_DAY[dayId].forEach(s => {
      if(skipKeys.has(s.key) || s.node !== "solid" || seen.has(s.key)) return;
      seen.add(s.key);
      const extra = ATTRACTIONS_DB[s.key] || {};
      list.push({
        key: s.key,
        name: s.name,
        desc: s.description,
        fullDesc: extra.desc || s.description,
        dica: extra.dica || "",
        admissao: extra.admissao || "",
        categoria: CATEGORY_BY_KEY[s.key] || "Outros",
        mapsUrl: s.map ? mapsPlaceUrl(s.map) : null
      });
    });
  });
  return list;
}

      <span class="resto-name">${data.name}</span>

  `;
  document.getElementById("resto-modal-overlay").classList.add("open");
  document.body.style.overflow = "hidden";

// Fase de captura: roda antes de qualquer stopPropagation nos botões de
// pin/Instagram (que usam isso pra não abrir o card por trás), então
// sempre consegue interceptar o clique pra avisar que está offline.
document.addEventListener("click", (e) => {
  const extLink = e.target.closest('a[target="_blank"]');
  if(extLink && "onLine" in navigator && !navigator.onLine){
    e.preventDefault();
    e.stopPropagation();
    showOfflineToast();
  }
}, true);

document.addEventListener("click", (e) => {
  const trigger = e.target.closest("[data-resto]");
  if(trigger){
    e.preventDefault();
    openRestoModal(trigger.getAttribute("data-resto"));
    return;
  }
  const attractionTrigger = e.target.closest("[data-attraction]");
  if(attractionTrigger){
    e.preventDefault();
    openAttractionModal(attractionTrigger.getAttribute("data-attraction"));
    return;
  }
  if(e.target.id === "resto-modal-close" || e.target.id === "resto-modal-overlay"){
    closeRestoModal();
  }
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeRestoModal();
});

function navigate(hash){
  window.location.hash = hash;
}

// Voltar por hierarquia fixa (não pelo histórico do navegador) — assim
// funciona igual mesmo quando o app abre direto numa tela funda (ex:
// restaurando a última tela vista ao reabrir pelo ícone).
function parentHash(hash){
  if(/^#\/dia\//.test(hash)) return "#/cronograma";
  return "#/";
}

function render(){
  const hash = window.location.hash || "#/";
  const app = document.getElementById("app");

  const dayMatch = hash.match(/^#\/dia\/(\d+)/);

  if (dayMatch) {
    const dayId = parseInt(dayMatch[1], 10);
    const day = DAYS.find(d => d.id === dayId);
    app.innerHTML = day.id === 1 ? renderDay1() : day.id === 2 ? renderDay2() : day.id === 3 ? renderDay3() : day.id === 4 ? renderDay4() : day.id === 5 ? renderDay5() : day.id === 6 ? renderDay6() : renderEmptyDay(day);
  } else if (hash.startsWith("#/gastronomia")) {
    app.innerHTML = renderGastronomia(hash);
  } else if (hash.startsWith("#/atracoes")) {
    app.innerHTML = renderAtracoes();
  } else if (hash.startsWith("#/ingressos")) {
    app.innerHTML = renderIngressos();
  } else if (hash.startsWith("#/cronograma")) {
    app.innerHTML = renderMacro();
  } else {
    app.innerHTML = renderLanding();
  }

  window.scrollTo(0, 0);
  attachHandlers();
}

function buildFlowSteps(){
  const flow = document.querySelector(".flow-details");
  if(!flow) return;

  const dayId = flow.getAttribute("data-day") || "1";
  const steps = STEPS_BY_DAY[dayId];
  if(!steps){
    console.warn(`buildFlowSteps: nenhuma configuração encontrada para o dia "${dayId}".`);
    return;
  }

  const rows = Array.from(flow.querySelectorAll(".tl-row"));

  // Agrupa as linhas estáticas pelo atributo data-step, na ordem de
  // primeira aparição — não depende de posição/índice numérico, então
  // adicionar, remover ou reordenar linhas no HTML estático não quebra
  // o agrupamento, desde que cada linha carregue o data-step correto.
  const rowsByStep = new Map();
  rows.forEach(row => {
    const key = row.getAttribute("data-step");
    if(!key) return; // linha sem data-step é ignorada (não deveria ocorrer)
    if(!rowsByStep.has(key)) rowsByStep.set(key, []);
    rowsByStep.get(key).push(row);
  });

  // Link com a rota do dia inteira (hotel → todas as paradas com coordenada → hotel)
  const routeStops = steps.filter(s => s.map).map(s => `${s.map.lat},${s.map.lng}`);
  const fullRouteUrl = `https://www.google.com/maps/dir/?api=1&origin=${HOTEL.lat},${HOTEL.lng}&destination=${HOTEL.lat},${HOTEL.lng}&waypoints=${routeStops.join("|")}&travelmode=walking`;

  const section = document.createElement("section");
  section.className = "flow-section";
  section.innerHTML = `<div class="section-title">📍 Fluxo do dia <a class="stop-count route-link" href="${fullRouteUrl}" target="_blank" rel="noopener">🗺️ ${steps.length} paradas · ver rota</a></div><div class="route flow-steps" style="padding:0 0 16px"><div class="route-line"></div></div>`;
  const list = section.querySelector(".flow-steps");

  steps.forEach((step, idx) => {
    const groupRows = rowsByStep.get(step.key) || [];
    if(groupRows.length === 0){
      console.warn(`buildFlowSteps: nenhuma linha encontrada para data-step="${step.key}" (dia ${dayId}) — verifique se o HTML estático tem essa tag.`);
      return;
    }

    const content = groupRows.map(row => row.querySelector(".tl-content")?.innerHTML || "").join("");
    const contentHolder = document.createElement("div");
    contentHolder.innerHTML = content;
    contentHolder.querySelectorAll(".flow-title, .flow-desc").forEach(el => el.remove());
    contentHolder.querySelectorAll(".flow-stop").forEach(el => {
      if(!el.textContent.trim()) el.remove();
    });

    const time = groupRows
      .map(row => row.querySelector(".tl-time")?.textContent.trim() || "")
      .find(Boolean) || "";

    // Monta um link de rota do Google Maps. Sem `origin`, o Maps usa a
    // localização atual — é o que queremos no meio do dia, já que o
    // usuário pode não estar exatamente onde o roteiro previu.
    const routeLink = (dest, mode, label, origin) =>
      `<a class="transit-link" href="https://www.google.com/maps/dir/?api=1${origin ? `&origin=${origin.lat},${origin.lng}` : ""}&destination=${dest.lat},${dest.lng}${dest.placeId ? `&destination_place_id=${dest.placeId}` : ""}&travelmode=${mode}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${label}</a>`;

    // 1) Saída do hotel → primeira parada real do dia.
    const firstStop = steps.find(x => x.map);
    const byTransit = step.chip === "station";
    let transitHtml = (step.key === "hotel-out" && firstStop)
      ? routeLink(firstStop.map, byTransit ? "transit" : "walking",
          `${byTransit ? "🚇" : "🚶"} Rota até ${firstStop.name.replace(/<[^>]+>/g,"")}`, HOTEL)
      : "";

    // 2) Volta para o hotel, partindo de onde a pessoa estiver.
    if(step.key === "hotel-back"){
      transitHtml = routeLink(HOTEL, "transit", "🏨 Rota até o hotel, daqui");
    }

    // 3) Trechos de metrô no meio do dia: botão dentro da própria linha
    // de transporte, apontando para a próxima parada com coordenada.
    // Não repete na saída do hotel (que já tem o botão principal) nem
    // quando o próximo ponto é a volta ao hotel (que tem o seu).
    const nextStop = steps.slice(idx + 1).find(x => x.map);
    if(nextStop && step.key !== "hotel-out" && nextStop.key !== "hotel-back"){
      contentHolder.querySelectorAll(".flow-transit").forEach(el => {
        if(!el.textContent.includes("🚇")) return;
        el.insertAdjacentHTML("beforeend",
          routeLink(nextStop.map, "transit", `🚇 Rota até ${nextStop.name.replace(/<[^>]+>/g,"")}`));
      });
    }

  const grupoIcon = step.grupo === "casal" ? `<span class="step-grupo" title="Com os sogros">👴🏻👵🏻</span>`
      : step.grupo === "velhinha" ? `<span class="step-grupo" title="Só a sogra vai ao teatro">👵🏻</span>` : "";

    const mapIconHtml = step.map
      ? `<a class="maps-icon-btn" href="${mapsPlaceUrl(step.map)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="Abrir ${step.name.replace(/<[^>]+>/g,"")} no Google Maps">📍</a>`
      : "";

    const durationHtml = step.duration
      ? `<div class="duration-tag">⏱️ Tempo sugerido: ${step.duration}</div>`
      : "";

    const row = document.createElement("div");
    row.className = "tl-row";
    row.innerHTML = `<div class="tl-time"></div><div class="tl-node"><div class="dot ${step.node === "hollow" ? "hollow" : ""}"></div></div><div class="tl-content"><details class="flow-step"><summary><span class="step-actions">${mapIconHtml}<span class="step-chevron">⌄</span></span><span class="step-summary">${time ? `<span class="step-time">${time}</span>` : ""}${grupoIcon}<strong>${step.name}</strong><span> — ${step.chip ? `<span class="${step.chip}-chip">${step.description}</span>` : step.description}</span></span></summary><div class="flow-step-body">${durationHtml}${contentHolder.innerHTML}${transitHtml}</div></details></div>`;

    list.appendChild(row);
  });

  flow.replaceWith(section);
}

function attachHandlers(){
  buildFlowSteps();
  attachTicketHandlers();
  document.querySelectorAll("[data-gday]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.stopPropagation();
      const v = el.getAttribute("data-gday");
      navigate(v === "resumo" ? "#/gastronomia" : `#/gastronomia/${v}`);
    });
  });
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    el.addEventListener("click", ()=> navigate(el.getAttribute("data-nav")));
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        navigate(el.getAttribute("data-nav"));
      }
    });
  });
  document.querySelectorAll("[data-back]").forEach(el=>{
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    const goBack = ()=> navigate(parentHash(window.location.hash));
    el.addEventListener("click", goBack);
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        goBack();
      }
    });
  });
  document.querySelectorAll(".resto-trigger").forEach(el=>{
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        if(el.hasAttribute("data-resto")) openRestoModal(el.getAttribute("data-resto"));
        else if(el.hasAttribute("data-attraction")) openAttractionModal(el.getAttribute("data-attraction"));
      }
    });
  });
  document.querySelectorAll("[data-scroll]").forEach(el=>{
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    const doScroll = ()=>{
      lastScrollY = window.scrollY;
      const target = document.getElementById(el.getAttribute("data-scroll"));
      if(target){
        target.scrollIntoView({behavior:"smooth", block:"start"});
        showReturnChip();
      }
    };
    el.addEventListener("click", doScroll);
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); doScroll(); }
    });
  });
  const chip = document.getElementById("return-chip");
  if(chip){
    chip.addEventListener("click", ()=>{
      window.scrollTo({top:lastScrollY, behavior:"smooth"});
      chip.classList.remove("show");
    });
  }
}

let lastScrollY = 0;
function showReturnChip(){
  const chip = document.getElementById("return-chip");
  if(chip) chip.classList.add("show");
}

window.addEventListener("hashchange", () => {
  try { localStorage.setItem("lastHash", window.location.hash); } catch(e){}
  render();
});

window.addEventListener("DOMContentLoaded", () => {
  // Abriu direto pelo ícone da tela de início (sem hash) — volta pra
  // onde a pessoa tinha parado, em vez de sempre reiniciar no menu.
  if(!window.location.hash || window.location.hash === "#/"){
    try {
      const saved = localStorage.getItem("lastHash");
      if(saved && saved !== "#/" && saved !== "#"){
        window.location.hash = saved;
        return; // o hashchange acima já dispara o render()
      }
    } catch(e){}
  }
  render();
});

  cafe:"Café", almoco:"Almoço", lanche:"Lanche",
  jantar:"Jantar", ceia:"Ceia", sobremesa:"Sobremesa"
};

function gastroEntries(){
  return Object.keys(RESTO_DB)
    .map(key => ({ key, ...RESTO_DB[key] }))
    .filter(r => r.slot !== "loja");
}

// Agrupa por dia e devolve os números que a tela usa em vários lugares.
function gastroPorDia(){
  const por = {};
  gastroEntries().forEach(r => { (por[r.dia] = por[r.dia] || []).push(r); });
  const out = {};
  Object.keys(por).map(Number).forEach(d => {
    const lista = por[d];
    const slots = {};
    lista.forEach(r => { (slots[r.slot] = slots[r.slot] || []).push(r); });
    // Só café, almoço e jantar contam para "resolvido" — lanche,
    // ceia e sobremesa são extras e não deixam o dia pendente.
    const CORE = ["cafe", "almoco", "jantar"];
    const nomes = Object.keys(slots).filter(sl => CORE.includes(sl));
    const resolvidas = nomes.filter(sl => slots[sl].some(r => r.status === "parada"));
    out[d] = {
      lista, slots,
      total: lista.filter(r => r.status === "parada").reduce((a, r) => a + (r.preco || 0), 0),
      refeicoes: nomes.length,
      resolvidas: resolvidas.length,
      pendentes: nomes.length - resolvidas.length,
      reservas: lista.filter(r => r.reserva && r.status === "parada").length
    };
  });
  return out;
}

  const info = DIA_INFO[d] || { data:"", dow:"", tema:"" };
  const barras = Array.from({ length: dados.refeicoes }, (_, i) =>
    `<i class="${i < dados.resolvidas ? "ok" : ""}"></i>`).join("");

  const blocos = SLOT_ORDER.filter(sl => dados.slots[sl]).map(sl => {
    const linhas = dados.slots[sl]
      .slice()
      .sort((a,b) => (a.status !== "parada") - (b.status !== "parada"))
      .map(gastroRow).join("");
    return `<div class="gslot">${SLOT_TXT[sl]}</div>${linhas}`;
  }).join("");

  return `
    <div class="gdia">
      <div class="gdia-head">
        <div class="gdia-title">Dia ${d} · ${info.dow}</div>
        ${dados.total ? `<div class="gdia-total">US$ ${dados.total * PESSOAS}</div>` : ""}
      </div>
      <div class="gdia-sub">${info.data} · ${info.tema}</div>
      <div class="gprog">${barras}</div>
      <div class="gprog-txt">${dados.resolvidas} de ${dados.refeicoes} refeições fechadas${dados.pendentes ? ` · ${dados.pendentes} em aberto` : " · tudo resolvido"}</div>
      ${blocos}
    </div>`;
}

function renderGastronomia(hash){
  const m = String(hash || "").match(/#\/gastronomia\/(\d+)/);
  const ativo = m ? Number(m[1]) : "resumo";
  const porDia = gastroPorDia();
  const dias = Object.keys(porDia).map(Number).sort((a,b) => a-b);

  let corpo;
  if(ativo === "resumo"){
    const totalViagem = dias.reduce((a,d) => a + porDia[d].total, 0);
    const pendTotal = dias.reduce((a,d) => a + porDia[d].pendentes, 0);
    const resTotal = dias.reduce((a,d) => a + porDia[d].reservas, 0);

    const linhas = dias.map(d => {
      const x = porDia[d], info = DIA_INFO[d];
      const barras = Array.from({ length: x.refeicoes }, (_, i) =>
        `<i class="${i < x.resolvidas ? "ok" : ""}"></i>`).join("");
      return `
        <div class="gsum-row" data-gday="${d}">
          <div class="gsum-left">
            <div class="gsum-dia">Dia ${d} <span>${info.dow} · ${info.data}</span></div>
            <div class="gsum-tema">${info.tema}</div>
            <div class="gprog small">${barras}</div>
          </div>
          <div class="gsum-right">
            <div class="gsum-valor">${x.total ? `US$ ${x.total * PESSOAS}` : "—"}</div>
            <div class="gsum-nota">${x.pendentes ? `${x.pendentes} em aberto` : "fechado"}</div>
          </div>
          <span class="grow-chev">›</span>
        </div>`;
    }).join("");

    corpo = `
      <div class="gastro-resumo">
        <span>Total dos confirmados · ${PESSOAS} pessoas</span>
        <b>US$ ${totalViagem * PESSOAS}</b>
      </div>
      <div class="gsum-stats">
        <div><b>${pendTotal}</b><span>refeições em aberto</span></div>
        <div><b>${resTotal}</b><span>reservas a fazer</span></div>
      </div>
      <div class="gsum-list">${linhas}</div>
      <div class="flow-tip" style="margin-top:16px;">
        <span>💵</span>
        <span class="tip-text">Valores para <b>${PESSOAS} pessoas</b>, já com imposto de 8,875% e gorjeta — 20% onde há serviço de mesa, quase nada em balcão. São estimativas.</span>
      </div>`;
  } else {
    const x = porDia[ativo];
    corpo = x ? gastroDiaBloco(ativo, x) : `<div class="placeholder-note">Nada cadastrado nesse dia ainda.</div>`;
  }

  return `
    <div class="topbar">
      <button class="back-btn" data-back aria-label="Voltar">←</button>
    </div>

    <div class="day-header">
      <div class="day-header-eyebrow">Valores para ${PESSOAS} pessoas</div>
      <h1>🍽️ Restaurantes &amp; Cafés</h1>
    </div>

    <div class="container" style="padding-top:12px;">
      ${chipsHtml(ativo)}
      ${corpo}
    </div>
    <footer class="spacer"></footer>
  `;
}
